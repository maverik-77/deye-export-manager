name: "Deye Manager"
version: "1.0.28"
slug: "deye_export_manager"
description: "Custom export scheduler for Deye inverters with 24-hour schedule management"
url: "https://github.com/maverik-77/deye-export-manager"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower-export
panel_title: Deye Manager
homeassistant_api: true
options:
  deye_entity: "number.deye_max_sell_power"
  battery_percentage: "sensor.deye_battery_soc"
schema:
  deye_entity: str
  battery_percentage: str
map:
  - homeassistant_config:rw
